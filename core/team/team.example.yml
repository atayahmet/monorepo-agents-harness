# .agents/team.yml template
# Team registry template. The installer never creates .agents/team.yml - run /monorepo-harness-team
# (or copy this file to <repo-root>/.agents/team.yml and edit it). Rules: core/team/AGENTS.md.
# This file holds personal data: keep only the IDs your tools use, and never put a token or a
# password here.
version: 1

members:
  - key: alice
    name: Alice Example
    role: developer
    title: Staff Engineer
    ids:
      git:
        - alice@example.com
        - alice@users.noreply.github.com
      github: alice-example
      # jira: "557058:0000"
      # slack: U0000000
  - key: carol
    name: Carol Example
    role: developer
    title: Engineer
    ids:
      git:
        - carol@example.com
      github: carol-example

contacts:
  - key: bob
    name: Bob Example
    role: product_owner
    title: Product Owner
    ids:
      slack: U1111111

# Workspace paths from the repo root (`.` = the root). Globs allowed: `*` = one segment, `**` = any
# depth. Values are member keys; `[]` means "ask the developer". Contacts cannot be assignees.
assignee_by_workspace:
  .: [alice]
  apps/api: [alice, carol]
  apps/web: []
  # libs/payments/*: [carol]
